# Render Blueprint(無料プラン)
# データは無料のSupabaseに保存するので、無料プランの再起動でも回答は消えません。
services:
  - type: web
    name: ai-interview
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/languages
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Google AI Studio の無料APIキー
      - key: ADMIN_PASSWORD
        sync: false          # 管理者画面のパスワード(自分で決める)
      - key: SUPABASE_URL
        sync: false          # Supabase の Project URL
      - key: SUPABASE_SECRET_KEY
        sync: false          # Supabase の secret key(または service_role key)
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: DAILY_AI_CALL_LIMIT
        value: "1000"
