<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理者画面 | AIインタビュー</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  aside { background: var(--ai); color: #fff; padding: 18px 14px; }
  aside h1 { font-size: 16px; margin: 0 0 4px; }
  aside .sub { font-size: 11px; opacity: .75; margin-bottom: 16px; line-height: 1.6; }
  details.more { margin-top: 4px; } details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  aside .study { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px; }
  aside .study.on, aside .study:hover { background: rgba(255,255,255,.14); }
  aside .study small { display: block; opacity: .7; font-size: 11px; margin-top: 2px; }
  aside .new { width: 100%; margin-bottom: 12px; background: #fff; color: var(--ai); border: 0; }
  main { padding: 24px 28px 60px; max-width: 1100px; }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; background: #fff3d6; color: #6b4a00; border: 1px solid #f0d9a0; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 22px; flex: 1; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button { background: none; border: 0; padding: 10px 14px; font: inherit; font-size: 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-color: var(--ai); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .langgrid { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .langgrid label, .check { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; font-weight: normal; }
  .langgrid input, .check input, td input[type=checkbox] { width: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.click { cursor: pointer; } tr.click:hover { background: #f8f4ec; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eee; white-space: nowrap; }
  .pill.completed, .pill.positive { background: #dff1e6; color: var(--ok); } .pill.active, .pill.mixed { background: #fff1d6; color: var(--warn); }
  .pill.negative { background: #f8dedb; color: var(--accent); } .pill.sim { background: #e7e3f6; color: #4b3f8f; }
  .share { display: flex; gap: 8px; align-items: center; }
  .share input { font-family: ui-monospace, monospace; font-size: 13px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; font-size: 14px; }
  .drop.over { border-color: var(--ai); background: #eef1f8; }
  .turn { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.6; }
  .turn .who { font-weight: 600; font-size: 12px; color: var(--muted); }
  .turn.user .who { color: var(--accent); }
  .turn .ja { color: #333; background: #faf7f1; padding: 6px 8px; border-radius: 8px; }
  .turn .topic { font-size: 11px; color: var(--muted); }
  .chips { margin-top: 4px; } .chips span { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin: 2px 4px 0 0; color: var(--muted); }
  .report { white-space: pre-wrap; line-height: 1.75; font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .login { max-width: 360px; margin: 14vh auto; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .q { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .q .num { font-weight: 700; color: var(--ai); padding-top: 10px; }
  .q .ctl { display: flex; flex-direction: column; gap: 4px; }
  .q input, .q textarea { margin-bottom: 6px; font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .kpi .v { font-size: 26px; font-weight: 700; } .kpi .l { font-size: 12px; color: var(--muted); }
  .bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .bar { display: grid; grid-template-columns: 120px 1fr 36px; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }
  .bar .track { background: #efe9df; border-radius: 4px; height: 12px; overflow: hidden; } .bar .fill { background: var(--ai); height: 100%; }
  .bar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.6; }
  .hit mark { background: #ffe58a; }
  .rep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
  .op { padding: 8px 10px; border-left: 3px solid var(--line); margin: 6px 0; font-size: 14px; }
  .op.positive { border-color: var(--ok); } .op.negative { border-color: var(--accent); }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } .turn { grid-template-columns: 1fr; } main { padding: 16px; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SENT = { positive: '好意的', mixed: '賛否混在', neutral: '中立', negative: '否定的' };
const root = $('#root');
let token = sessionStorage.getItem('adminToken');
let status = {}, LANGS = {}, studies = [], current = null, tab = 'settings', pending = [], draft = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) } });
  if (r.status === 401 && !path.endsWith('/login')) { sessionStorage.removeItem('adminToken'); token = null; renderLogin(); throw new Error('ログインが必要です'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function download(path, name) {
  const r = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
  const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = name; a.click();
}

function renderLogin(msg = '') {
  root.innerHTML = `<div class="login card">
    <h3>管理者ログイン</h3>
    <div class="field"><label>パスワード</label><input type="password" id="pw" autofocus></div>
    ${msg ? `<p style="color:var(--accent);font-size:13px">${esc(msg)}</p>` : ''}
    <button class="btn primary big" id="login">ログイン</button></div>`;
  const go = async () => {
    try { const r = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) }); token = r.token; sessionStorage.setItem('adminToken', token); boot(); }
    catch (e) { renderLogin(e.message); }
  };
  $('#login').onclick = go; $('#pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

async function boot() {
  try { LANGS = await api('/api/languages'); } catch { return; }
  await refresh();
  if (studies[0] && !current) current = studies[0].id;
  render();
}
async function refresh() { [status, studies] = await Promise.all([api('/api/admin/status'), api('/api/admin/studies')]); }
function go(id, t = 'settings') { current = id; tab = t; pending = []; draft = null; render(); }

function render() {
  const s = studies.find((x) => x.id === current);
  root.innerHTML = `<div class="layout">
    <aside>
      <h1>AIインタビュー</h1>
      <div class="sub">${status.mock ? 'デモモード · ' : ''}AI ${status.usageToday}/${status.dailyLimit}</div>
      <button class="btn new" id="new">＋ 新規</button>
      ${studies.map((x) => `<button class="study ${x.id === current ? 'on' : ''}" data-id="${x.id}">${esc(x.title)}<small>${x.active === false ? '停止 · ' : ''}${x.sessionCount}件</small></button>`).join('')}
      <div style="margin-top:20px"><button class="study" id="logout">ログアウト</button></div>
    </aside>
    <main id="main"></main></div>`;
  root.querySelectorAll('aside .study[data-id]').forEach((b) => b.onclick = () => go(b.dataset.id));
  $('#new').onclick = () => go('new');
  $('#logout').onclick = () => { sessionStorage.removeItem('adminToken'); token = null; renderLogin(); };
  const main = $('#main');
  const banners = [];
  if (status.mock) banners.push('デモモード(GEMINI_API_KEY 未設定)');
  if (!status.cloud) banners.push('Supabase未設定: 再起動で回答が消えます');
  if (status.defaultPassword) banners.push('パスワードが初期値 (admin) のままです');
  main.innerHTML = banners.map((b) => `<div class="banner">${b}</div>`).join('');
  if (current === 'new') {
    const box = document.createElement('div'); main.appendChild(box);
    return renderSettings(box, draft || { title: '', objectives: '', topics: '', instructions: '', intro: '', publicTitle: '', maxQuestions: 10, languages: ['en', 'zh-CN', 'zh-TW', 'ko', 'es', 'fr', 'de'], askProfile: true, active: true, materials: [], questions: [] }, true);
  }
  if (!s) { main.innerHTML += `<div class="empty">「＋ 新規」から作成</div>`; return; }
  const link = `${location.origin}/i/${s.id}`;
  const tabs = [['settings', '設定'], ['sessions', `回答 ${s.sessionCount}`], ['stats', '統計'], ['analysis', '分析'], ['test', 'テスト']];
  main.insertAdjacentHTML('beforeend', `
    <div class="head"><h2>${esc(s.title)}</h2>${s.active === false ? '<span class="pill">停止中</span>' : '<span class="pill completed">受付中</span>'}</div>
    <div class="share" style="margin-bottom:16px"><input readonly value="${esc(link)}" id="link"><button class="btn" id="copy">コピー</button><a class="btn" href="${esc(link)}" target="_blank">開く</a></div>
    <div class="tabs">${tabs.map(([k, v]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${v}</button>`).join('')}</div><div id="tab"></div>`);
  $('#copy').onclick = () => { navigator.clipboard.writeText(link); $('#copy').textContent = '✓'; };
  main.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => { tab = b.dataset.t; draft = null; render(); });
  const el = $('#tab');
  if (tab === 'settings') (draft ? Promise.resolve(draft) : api(`/api/admin/studies/${s.id}`)).then((full) => renderSettings(el, full, false));
  if (tab === 'sessions') renderSessions(el, s, false);
  if (tab === 'stats') renderStats(el, s);
  if (tab === 'analysis') renderAnalysis(el, s);
  if (tab === 'test') renderTest(el, s);
}

// ---------- 設定 ----------
function renderSettings(el, s, isNew) {
  let questions = []; // 質問はAIが資料と目的から考える(質問リストは使わない)
  let mats = (s.materials || []).map((m) => ({ ...m }));
  el.innerHTML = `
  ${isNew ? '' : `<div class="card"><div class="row"><input id="hint" placeholder="AIへの要望(任意)" style="flex:1"><button class="btn primary" id="gen">✨ 資料からAIで作成</button></div><div class="small" id="genmsg"></div></div>`}
  <div class="card">
    <div class="field"><label>調査名</label><input id="title" value="${esc(s.title)}"></div>
    <div class="field"><label>目的</label><textarea id="objectives" rows="3">${esc(s.objectives)}</textarea></div>
    <div class="field"><label>テーマ</label><textarea id="topics" rows="2">${esc(s.topics)}</textarea></div>
    <details class="more"><summary>詳細設定</summary>
    <div class="field"><label>AIへの追加指示</label><textarea id="instructions" rows="2">${esc(s.instructions)}</textarea></div>
    <div class="grid2">
      <div class="field"><label>質問数の上限</label><input id="maxQuestions" type="number" min="1" max="40" value="${esc(s.maxQuestions)}"></div>
      <div class="field"><label>表示タイトル</label><input id="publicTitle" value="${esc(s.publicTitle)}"></div>
    </div>
    <div class="field"><label>案内文</label><textarea id="intro" rows="3">${esc(s.intro)}</textarea></div>
    <div class="field"><label>言語</label><div class="langgrid">${Object.entries(LANGS).map(([k, v]) => `<label><input type="checkbox" value="${k}" ${s.languages?.includes(k) ? 'checked' : ''}>${esc(v)}</label>`).join('')}</div></div>
    <div class="row"><label class="check"><input type="checkbox" id="askProfile" ${s.askProfile !== false ? 'checked' : ''}>属性を聞く</label>
      <label class="check"><input type="checkbox" id="active" ${s.active !== false ? 'checked' : ''}>受付中</label></div>
    </details>
  </div>
  <div class="card" hidden><h3>質問</h3>
    <div id="qs"></div><button class="btn small" id="addq" style="margin-top:10px">＋ 追加</button>
  </div>
  <div class="card"><h3>資料</h3>
    <table><thead><tr><th>ファイル</th><th>メモ</th><th>表示</th><th></th></tr></thead><tbody id="mats"></tbody></table>
    <div class="drop" id="drop" style="margin-top:12px">＋ ファイルを追加</div>
    <input type="file" id="file" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.csv,.json,audio/*,video/*">
  </div>
  <div class="row"><button class="btn primary" id="save">${isNew ? '作成' : '保存'}</button>
    <button class="btn" id="clearAll" title="資料以外の文言を空にします">全消去</button>
    ${isNew ? '' : '<button class="btn danger" id="del">削除</button>'}<span id="msg" class="small"></span></div>`;

  const drawQs = () => {
    $('#qs', el).innerHTML = questions.length ? questions.map((q, i) => `<div class="q">
      <div class="num">${i + 1}</div>
      <div><input data-i="${i}" data-f="text" value="${esc(q.text)}" placeholder="質問">
        <input data-i="${i}" data-f="followUp" value="${esc(q.followUp || '')}" placeholder="深掘り(任意)">
        <input data-i="${i}" data-f="quickReplies" value="${esc(q.quickReplies)}" placeholder="選択肢(任意) A / B / C"></div>
      <div class="ctl"><button class="btn small" data-mv="${i}:-1" ${i === 0 ? 'disabled' : ''}>↑</button><button class="btn small" data-mv="${i}:1" ${i === questions.length - 1 ? 'disabled' : ''}>↓</button><button class="btn small danger" data-rq="${i}">×</button></div></div>`).join('') : '<p class="hint">なし(AIにおまかせ)</p>';
    el.querySelectorAll('#qs input').forEach((inp) => inp.oninput = () => { questions[inp.dataset.i][inp.dataset.f] = inp.value; });
    el.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => { const [i, d] = b.dataset.mv.split(':').map(Number); [questions[i], questions[i + d]] = [questions[i + d], questions[i]]; drawQs(); });
    el.querySelectorAll('[data-rq]').forEach((b) => b.onclick = () => { questions.splice(+b.dataset.rq, 1); drawQs(); });
  };
  drawQs();
  $('#clearAll', el).onclick = () => {
    if (!confirm('調査名・調査目的・テーマ・追加指示・表示タイトル・案内文・質問リストをすべて空にします。\n(資料・言語・チェック項目はそのまま。「保存する」を押すまで保存はされません)\nよろしいですか?')) return;
    ['title', 'objectives', 'topics', 'instructions', 'publicTitle', 'intro', 'hint'].forEach((id) => { const f = $('#' + id, el); if (f) f.value = ''; });
    questions = []; drawQs();
    $('#msg', el).textContent = '✓ 未保存';
  };
  $('#addq', el).onclick = () => { questions.push({ text: '', followUp: '', quickReplies: '' }); drawQs(); el.querySelectorAll('#qs input[data-f=text]')[questions.length - 1].focus(); };

  const drawMats = () => {
    const rows = [...mats.map((m, i) => ({ m, i, kind: 'saved' })), ...pending.map((m, i) => ({ m, i, kind: 'new' }))];
    $('#mats', el).innerHTML = rows.length ? rows.map(({ m, i, kind }) => `<tr>
      <td>${kind === 'saved' && !isNew ? `<a href="#" data-open="${m.id}">${esc(m.name)}</a>` : esc(m.name)}<div class="hint">${(m.size / 1024).toFixed(0)} KB${kind === 'new' ? ' · 未保存' : ''}</div></td>
      <td><input data-k="${kind}" data-i="${i}" data-f="note" value="${esc(m.note || '')}" "></td>
      <td><input type="checkbox" data-k="${kind}" data-i="${i}" data-f="showToRespondent" ${m.showToRespondent ? 'checked' : ''}></td>
      <td><button class="btn small danger" data-rm="${kind}:${i}">削除</button></td></tr>`).join('') : '<tr><td colspan="4" class="hint">なし</td></tr>';
    el.querySelectorAll('#mats input').forEach((inp) => inp.onchange = () => {
      const list = inp.dataset.k === 'saved' ? mats : pending;
      list[inp.dataset.i][inp.dataset.f] = inp.type === 'checkbox' ? inp.checked : inp.value;
    });
    el.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { const [k, i] = b.dataset.rm.split(':'); (k === 'saved' ? mats : pending).splice(i, 1); drawMats(); });
    el.querySelectorAll('[data-open]').forEach((a) => a.onclick = async (e) => { e.preventDefault(); const r = await fetch(`/api/admin/studies/${s.id}/materials/${a.dataset.open}`, { headers: { Authorization: 'Bearer ' + token } }); window.open(URL.createObjectURL(await r.blob())); });
  };
  drawMats();
  const addFiles = async (files) => {
    for (const f of files) {
      const data = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(f); });
      const mimeType = f.type || ({ md: 'text/markdown', csv: 'text/csv', txt: 'text/plain' }[f.name.split('.').pop().toLowerCase()] || 'application/octet-stream');
      pending.push({ name: f.name, mimeType, size: f.size, data, note: '', showToRespondent: /^image\//.test(mimeType) });
    }
    if (pending.reduce((a, b) => a + b.size, 0) > 30 * 1024 * 1024) alert('一度に保存できるのは合計30MBまでです。分けて保存してください。');
    drawMats();
  };
  const drop = $('#drop', el), fileInp = $('#file', el);
  drop.onclick = () => fileInp.click();
  fileInp.onchange = () => addFiles(fileInp.files);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); };

  const collect = () => ({
    title: $('#title', el).value.trim(), objectives: $('#objectives', el).value, topics: $('#topics', el).value, instructions: $('#instructions', el).value,
    maxQuestions: Number($('#maxQuestions', el).value), publicTitle: $('#publicTitle', el).value, intro: $('#intro', el).value,
    languages: [...el.querySelectorAll('.langgrid input:checked')].map((x) => x.value),
    askProfile: $('#askProfile', el).checked, active: $('#active', el).checked,
    questions: questions.filter((q) => q.text.trim()).map((q) => ({ id: q.id, text: q.text, followUp: q.followUp, quickReplies: String(q.quickReplies || '').split(/[\/／]/).map((x) => x.trim()).filter(Boolean) })),
  });

  if (!isNew) $('#gen', el).onclick = async () => {
    if (!mats.length && !confirm('保存済みの資料がありません。調査名だけから作りますか?')) return;
    $('#gen', el).disabled = true; $('#genmsg', el).textContent = '作成中…';
    try {
      const g = await api(`/api/admin/studies/${s.id}/generate`, { method: 'POST', body: JSON.stringify({ hint: $('#hint', el).value }) });
      const cur = collect();
      draft = { ...s, ...cur, materials: mats, objectives: g.objectives, topics: g.topics, publicTitle: g.publicTitle, intro: g.intro, questions: [] };
      el.innerHTML = ''; renderSettings(el, draft, false);
      $('#genmsg', el).textContent = '✓ 未保存';
    } catch (e) { $('#genmsg', el).textContent = e.message; $('#gen', el).disabled = false; }
  };

  $('#save', el).onclick = async () => {
    const body = { ...collect(), materials: mats.map((m) => ({ id: m.id, note: m.note, showToRespondent: m.showToRespondent })),
      newMaterials: pending.map(({ name, mimeType, data, note, showToRespondent }) => ({ name, mimeType, data, note, showToRespondent })) };
    if (!body.title) return alert('調査名を入力してください');
    $('#save', el).disabled = true; $('#msg', el).textContent = '保存中…';
    try {
      const saved = await api(isNew ? '/api/admin/studies' : `/api/admin/studies/${s.id}`, { method: isNew ? 'POST' : 'PUT', body: JSON.stringify(body) });
      await refresh(); go(saved.id);
    } catch (e) { $('#msg', el).textContent = e.message; $('#save', el).disabled = false; }
  };
  if (!isNew) $('#del', el).onclick = async () => {
    if (!confirm('この調査の設定を削除します(回答データはサーバーの data フォルダに残ります)。よろしいですか?')) return;
    await api(`/api/admin/studies/${s.id}`, { method: 'DELETE' }); await refresh(); go(studies[0]?.id || null);
  };
}

// ---------- 回答一覧・詳細 ----------
async function renderSessions(el, s, simulated) {
  const list = (await api(`/api/admin/studies/${s.id}/sessions`)).filter((x) => !!x.simulated === simulated);
  if (!list.length) { el.innerHTML = simulated ? '' : '<div class="empty">回答なし</div>'; return; }
  el.innerHTML = `<div class="card"><table><thead><tr><th>開始日時</th><th>状態</th><th>言語</th>${simulated ? '<th>ペルソナ</th>' : '<th>国・地域</th><th>年齢</th><th>訪日</th>'}<th>回答数</th><th>反応</th><th>関心度</th>${simulated ? '' : '<th>満足度</th>'}</tr></thead><tbody>
    ${list.map((x) => `<tr class="click" data-id="${x.id}"><td>${new Date(x.startedAt).toLocaleString('ja-JP')}</td>
      <td><span class="pill ${x.status}">${x.status === 'completed' ? '完了' : '回答中/中断'}</span></td><td>${esc(x.languageName)}</td>
      ${simulated ? `<td>${esc((x.persona || '').slice(0, 40))}</td>` : `<td>${esc(x.profile?.country || '-')}</td><td>${esc(x.profile?.age || '-')}</td><td>${esc({ yes: 'あり', no: 'なし', many: '複数回' }[x.profile?.visitedJapan] || '-')}</td>`}
      <td>${x.answerCount}</td><td>${x.report ? `<span class="pill ${x.report.sentiment}">${SENT[x.report.sentiment] || '-'}</span>` : '-'}</td><td>${x.report?.interest_score ? '★'.repeat(x.report.interest_score) : '-'}</td>
      ${simulated ? '' : `<td>${x.rating ? x.rating.score + '/5' : '-'}</td>`}</tr>`).join('')}
  </tbody></table></div><div id="detail"></div>`;
  el.querySelectorAll('tr.click').forEach((tr) => tr.onclick = () => showSession(s, tr.dataset.id, $('#detail', el)));
}

function reportHtml(r) {
  if (!r) return '<p class="hint">なし</p>';
  return `<div class="rep-grid">
      <div class="kpi"><div class="l">反応</div><div class="v" style="font-size:18px"><span class="pill ${r.sentiment}" style="font-size:14px">${SENT[r.sentiment] || r.sentiment}</span></div></div>
      <div class="kpi"><div class="l">関心度</div><div class="v" style="font-size:18px">${'★'.repeat(r.interest_score || 0)}${'☆'.repeat(5 - (r.interest_score || 0))}</div></div>
      <div class="kpi"><div class="l">回答者タイプ</div><div style="font-weight:600">${esc(r.respondent_type)}</div><div class="hint">${esc(r.respondent_type_description)}</div></div></div>
    <div class="report">${esc(r.summary)}</div>
    ${(r.opinions || []).length ? `<h4 style="margin:14px 0 4px">主な意見</h4>${r.opinions.map((o) => `<div class="op ${o.polarity}"><b>${esc(o.title)}</b><br>${esc(o.content)}</div>`).join('')}` : ''}
    ${(r.quotes || []).length ? `<h4 style="margin:14px 0 4px">印象的な発言</h4>${r.quotes.map((q) => `<div class="op">“${esc(q.original)}”<div class="hint">${esc(q.ja)}</div></div>`).join('')}` : ''}`;
}

async function showSession(s, sid, d, highlight) {
  const x = await api(`/api/admin/studies/${s.id}/sessions/${sid}`);
  const full = await api(`/api/admin/studies/${s.id}`);
  const qText = Object.fromEntries((full.questions || []).map((q, i) => [q.id, `Q${i + 1}`]));
  d.innerHTML = `<div class="card">
    <div class="head"><h3 style="flex:1;margin:0">${x.simulated ? '<span class="pill sim">模擬</span> ' : ''}回答の詳細 · ${esc(x.languageName)} · ${new Date(x.startedAt).toLocaleString('ja-JP')}</h3>
      <button class="btn small" id="rep">レポートを${x.report ? '作り直す' : '作る'}</button><button class="btn small danger" id="delS">削除</button></div>
    <div class="small">${x.simulated ? 'ペルソナ: ' + esc(x.persona) : 'プロフィール: ' + esc(Object.entries(x.profile || {}).map(([k, v]) => `${k}=${v}`).join(', ') || 'なし')}</div>
    ${x.rating ? `<div class="small">回答者の満足度: ${'★'.repeat(x.rating.score)} ${esc(x.rating.comment)}</div>` : ''}
    <div class="card" style="margin-top:12px;background:#faf7f1"><h3>AIレポート</h3>${reportHtml(x.report)}</div>
    <div class="turn" style="font-size:12px;color:var(--muted)"><div></div><div>原文</div><div>日本語訳</div></div>
    ${x.messages.map((m, i) => `<div class="turn ${m.role}" id="m${i}" ${highlight === i ? 'style="background:#fff8d6"' : ''}><div><div class="who">${m.role === 'ai' ? 'AI' : '回答者'}</div>${m.questionId && qText[m.questionId] ? `<div class="topic">${qText[m.questionId]}</div>` : ''}${m.topic ? `<div class="topic">${esc(m.topic)}</div>` : ''}${m.materialId ? `<div class="topic">📄 資料を提示</div>` : ''}</div>
      <div>${esc(m.text)}${m.quickReplies?.length ? `<div class="chips">${m.quickReplies.map((q) => `<span>${esc(q)}</span>`).join('')}</div>` : ''}</div><div class="ja">${esc(m.ja || (x.language === 'ja' ? m.text : '(訳なし)'))}</div></div>`).join('')}
  </div>`;
  $('#rep', d).onclick = async () => { $('#rep', d).disabled = true; $('#rep', d).textContent = '作成中…'; try { await api(`/api/admin/studies/${s.id}/sessions/${sid}/report`, { method: 'POST' }); } catch (e) { alert(e.message); } showSession(s, sid, d); };
  $('#delS', d).onclick = async () => { if (!confirm('この回答を削除しますか?元に戻せません。')) return; await api(`/api/admin/studies/${s.id}/sessions/${sid}`, { method: 'DELETE' }); await refresh(); render(); };
  (highlight != null ? $('#m' + highlight, d) : d).scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ---------- 統計・検索 ----------
function bars(title, obj) {
  const entries = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const max = Math.max(1, ...entries.map((e) => e[1]));
  return `<div class="card"><h3>${title}</h3>${entries.length ? entries.map(([k, v]) => `<div class="bar"><span class="lab" title="${esc(k)}">${esc(k)}</span><div class="track"><div class="fill" style="width:${(v / max) * 100}%"></div></div><span>${v}</span></div>`).join('') : '<p class="hint">データなし</p>'}</div>`;
}
async function renderStats(el, s) {
  const st = await api(`/api/admin/studies/${s.id}/stats`);
  el.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="v">${st.total}</div><div class="l">回答者数</div></div>
      <div class="kpi"><div class="v">${st.completionRate}%</div><div class="l">完了率</div></div>
      <div class="kpi"><div class="v">${st.avgAnswers ?? '-'}</div><div class="l">平均回答数</div></div>
      <div class="kpi"><div class="v">${st.avgInterest ?? '-'}</div><div class="l">関心度</div></div>
      <div class="kpi"><div class="v">${st.avgRating ?? '-'}</div><div class="l">満足度</div></div>
    </div>
    <div class="card">
      <div class="row"><input id="q" placeholder="🔍 検索" style="flex:1"><label class="check"><input type="checkbox" id="sim">模擬も</label><button class="btn primary" id="go">検索</button></div>
      <div id="hits"></div></div>
    <div class="bars">${bars('反応', st.bySentiment)}${bars('言語', st.byLanguage)}${bars('国・地域', st.byCountry)}${bars('年齢', st.byAge)}${bars('訪日経験', st.byVisited)}${bars('タイプ', st.byType)}</div>
    ${st.questionReach.length ? `<div class="card"><h3>質問の到達数</h3>${st.questionReach.map((q, i) => `<div class="bar" style="grid-template-columns: 1fr 160px 36px"><span class="lab">Q${i + 1}. ${esc(q.text)}</span><div class="track"><div class="fill" style="width:${st.total ? (q.reached / st.total) * 100 : 0}%"></div></div><span>${q.reached}</span></div>`).join('')}</div>` : ''}
    ${st.simulatedCount ? `<p class="hint">模擬 ${st.simulatedCount}件は除外</p>` : ''}<div id="detail"></div>`;
  const search = async () => {
    const q = $('#q', el).value.trim(); if (!q) return;
    const hits = await api(`/api/admin/studies/${s.id}/search?q=${encodeURIComponent(q)}&sim=${$('#sim', el).checked ? 1 : 0}`);
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const mark = (t) => esc(t).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (m) => `<mark>${m}</mark>`);
    $('#hits', el).innerHTML = `<p class="small">${hits.length}件</p>` + hits.map((h) => `<div class="hit"><div class="small">${h.simulated ? '<span class="pill sim">模擬</span> ' : ''}${esc(h.languageName)} ${esc(h.country)} · 質問: ${esc(h.question.slice(0, 80))}</div>
      <div>${mark(h.text)}</div>${h.ja ? `<div class="hint">${mark(h.ja)}</div>` : ''}<a href="#" data-s="${h.sessionId}" data-i="${h.index}" class="small">会話の前後を見る</a></div>`).join('');
    el.querySelectorAll('[data-s]').forEach((a) => a.onclick = (e) => { e.preventDefault(); showSession(s, a.dataset.s, $('#detail', el), +a.dataset.i); });
  };
  $('#go', el).onclick = search; $('#q', el).onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) search(); };
}

// ---------- 全体分析・書き出し ----------
async function renderAnalysis(el, s) {
  const full = await api(`/api/admin/studies/${s.id}`);
  el.innerHTML = `<div class="card"><h3>AI分析</h3>
    <div class="row"><button class="btn primary" id="run">${full.analysis ? '分析し直す' : '分析する'}</button><span class="small" id="st">${full.analysis ? '前回の分析: ' + new Date(full.analysis.at).toLocaleString('ja-JP') : ''}</span></div>
    ${full.analysis ? `<div class="report" style="margin-top:14px">${esc(full.analysis.text)}</div>` : ''}</div>
    <div class="card"><h3>書き出し</h3><div class="row">
      <button class="btn" data-x="export.csv?kind=messages" data-n="messages.csv">全発言 CSV</button>
      <button class="btn" data-x="export.csv?kind=summary" data-n="summary.csv">レポート CSV</button>
      <button class="btn" data-x="export.json" data-n="all.json">JSON</button></div></div>`;
  $('#run', el).onclick = async () => { $('#run', el).disabled = true; $('#st', el).textContent = '分析中…'; try { await api(`/api/admin/studies/${s.id}/analyze`, { method: 'POST' }); renderAnalysis(el, s); } catch (e) { $('#st', el).textContent = e.message; $('#run', el).disabled = false; } };
  el.querySelectorAll('[data-x]').forEach((b) => b.onclick = () => download(`/api/admin/studies/${s.id}/${b.dataset.x}`, `interview-${s.id}-${b.dataset.n}`));
}

const PERSONAS = [
  '日本に行ったことがない30代のアメリカ人。日本文化には少し興味があるが、値段や作法に不安がある。',
  '日本に3回旅行したフランス人の40代女性。アニメより伝統工芸が好きで、本物志向。',
  '中国・上海の20代会社員。SNS映えする体験を好み、短時間で気軽に楽しめるものを求める。',
  '日本文化に特に関心がないドイツ人の50代男性。観光は効率重視で、説明が長いと退屈する。',
];
function renderTest(el, s) {
  el.innerHTML = `<div class="card"><h3>AI模擬回答</h3>
    <div class="field"><label>ペルソナ</label><textarea id="persona" rows="2">${esc(PERSONAS[0])}</textarea>
      <div class="row" style="margin-top:6px">${PERSONAS.map((p, i) => `<button class="btn small" data-p="${i}">例${i + 1}</button>`).join('')}</div></div>
    <div class="field" style="max-width:260px"><label>言語</label><select id="plang">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${k === 'en' ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
    <div class="row"><button class="btn primary" id="sim">実行</button><span class="small" id="simmsg"></span></div></div>
    <div id="simlist"></div>`;
  el.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { $('#persona', el).value = PERSONAS[b.dataset.p]; });
  $('#sim', el).onclick = async () => {
    $('#sim', el).disabled = true; $('#simmsg', el).textContent = '実行中…';
    try { await api(`/api/admin/studies/${s.id}/simulate`, { method: 'POST', body: JSON.stringify({ persona: $('#persona', el).value, language: $('#plang', el).value }) }); $('#simmsg', el).textContent = '✓ 完了'; await refresh(); }
    catch (e) { $('#simmsg', el).textContent = e.message; }
    $('#sim', el).disabled = false; renderSessions($('#simlist', el), s, true);
  };
  renderSessions($('#simlist', el), s, true);
}
