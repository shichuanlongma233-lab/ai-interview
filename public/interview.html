    const full = list.find((x) => x.toLowerCase() === l.toLowerCase());
    if (full) return full;
    if (/^zh/i.test(l)) { const z = /TW|HK|Hant/i.test(l) ? 'zh-TW' : 'zh-CN'; if (list.includes(z)) return z; }
    const short = list.find((x) => x.split('-')[0] === l.split('-')[0]);
    if (short) return short;
  }
  return list.includes('en') ? 'en' : list[0];
}

async function init() {
  try {
    [study, LANGS] = await Promise.all([api(`/api/public/studies/${studyId}`), api('/api/languages')]);
  } catch { app.innerHTML = `<div class="notice">${UI.en.notfound}</div>`; return; }
  document.title = study.title;
  const saved = JSON.parse(localStorage.getItem(store) || 'null');
  if (saved?.token) {
    token = saved.token;
    try { session = await api(`/api/public/sessions/${saved.id}`); lang = session.language; return renderChat(); }
    catch { localStorage.removeItem(store); token = null; }
  }
  if (!study.active) { lang = guessLang(Object.keys(UI)); app.innerHTML = `<div class="notice">${MASCOT()}<p>${t('closed')}</p></div>`; return; }
  const list = study.languages?.length ? study.languages : Object.keys(LANGS);
  lang = guessLang(list);
  renderIntro(list);
}

function renderIntro(list) {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  const ages = ['18-24', '25-34', '35-44', '45-54', '55-64', '65+'];
  app.innerHTML = `
  <div class="seigaiha"></div>
  <div class="intro">
    <div class="brand">✿ ${esc(LANGS[lang] || '')}</div>
    <div class="hero">
      <span class="kasumi" style="width:120px;height:34px;left:-20px;top:40px"></span>
      <span class="kasumi" style="width:90px;height:26px;right:-10px;top:150px"></span>
      ${MASCOT()}
      <div class="bubble">${esc(t('hello'))}</div>
    </div>
    <h2 class="title">${esc(study.title)}</h2>
    ${study.intro ? `<p class="lead">${esc(study.intro)}</p>` : ''}
    <div class="card sect"><h3>${t('lang')}</h3>
      <div class="langs">${list.map((l) => `<button data-l="${l}" class="${l === lang ? 'on' : ''}">${esc(LANGS[l])}</button>`).join('')}</div></div>
    ${study.askProfile ? `
    <div class="card sect"><h3>${t('about')} <span class="small">${t('optional')}</span></h3>
      <div class="field"><label>${t('country')}</label><input id="country" maxlength="80"></div>
      <div class="grid2">
        <div class="field"><label>${t('age')}</label><select id="age"><option value="">${t('sel')}</option>${ages.map((a) => `<option>${a}</option>`).join('')}</select></div>
        <div class="field"><label>${t('gender')}</label><select id="gender"><option value="">${t('sel')}</option><option value="male">${t('male')}</option><option value="female">${t('female')}</option><option value="other">${t('other')}</option></select></div>
      </div>
      <div class="field" style="margin:0"><label>${t('visited')}</label><select id="visited"><option value="">${t('sel')}</option><option value="no">${t('no')}</option><option value="yes">${t('yes')}</option><option value="many">${t('many')}</option></select></div></div>` : ''}
    <p class="consent">${t('consent')}</p>
    <button class="go" id="start">${t('start')}</button>
  </div>`;
  app.querySelectorAll('.langs button').forEach((b) => b.onclick = () => {
    const keep = readProfile(); lang = b.dataset.l; renderIntro(list); writeProfile(keep);
  });
  app.querySelector('#start').onclick = start;
}
const readProfile = () => Object.fromEntries(['country', 'age', 'gender', 'visited'].map((k) => [k, document.getElementById(k)?.value || '']));
const writeProfile = (p) => Object.entries(p).forEach(([k, v]) => { const el = document.getElementById(k); if (el) el.value = v; });

async function start() {
  const btn = app.querySelector('#start'); btn.disabled = true; btn.textContent = '…';
  const p = readProfile();
  try {
    session = await api(`/api/public/studies/${studyId}/sessions`, { method: 'POST', body: JSON.stringify({ language: lang, profile: { country: p.country, age: p.age, gender: p.gender, visitedJapan: p.visited } }) });
    token = session.token;
    localStorage.setItem(store, JSON.stringify({ id: session.id, token }));
    renderChat();
  } catch (e) { alert(e.message || t('err')); btn.disabled = false; btn.textContent = t('start'); }
}

function renderChat() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  app.innerHTML = `
    <header class="top"><div class="row1">${AV()}<h1>${esc(study.title)}</h1><span class="count" id="prog"></span></div><div class="dots" id="dots"></div></header>
    <div class="chat" id="chat"></div>
    <div class="composer" id="composer">
      <div class="quick" id="quick"></div>
      <div class="inbar">
        <textarea id="input" rows="1" placeholder="${t('ph')}"></textarea>
        <button class="send" id="send" aria-label="${t('send')}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <button class="endlink" id="end">${t('end')}</button>
    </div>`;
  const input = app.querySelector('#input');
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); answer(); } });
  app.querySelector('#send').onclick = () => answer();
  app.querySelector('#end').onclick = () => { if (confirm(t('confirmEnd'))) answer(true); };
  drawMessages();
}

function drawMessages(typing = false) {
  const chat = document.getElementById('chat');
  chat.innerHTML = session.messages.map((m) => {
    let h = '';
    if (m.material) {
      h += `<div class="material">${/^image\//.test(m.material.mimeType) ? `<img src="${m.material.url}" alt="${esc(m.material.name)}">` : ''}<a href="${m.material.url}" target="_blank" rel="noopener">📄 ${esc(m.material.name)}</a></div>`;
    }
    return h + (m.role === 'ai' ? `<div class="ai-row">${AV()}<div class="msg ai">${esc(m.text)}</div></div>` : `<div class="msg user">${esc(m.text)}</div>`);
  }).join('') + (typing ? `<div class="ai-row">${AV()}<div class="msg ai typing"><i></i><i></i><i></i></div></div>` : '');
  const qn = session.messages.filter((m) => m.role === 'ai').length;
  const total = Math.max(study.maxQuestions || 10, qn);
  const active = session.status === 'active';
  document.getElementById('prog').textContent = active ? `${t('q')} ${qn} / ${total}` : '';
  document.getElementById('dots').innerHTML = active ? Array.from({ length: Math.min(total, 15) }, (_, i) => `<span class="dot ${i + 1 < qn ? 'past' : i + 1 === qn ? 'now' : ''}">${i + 1 === qn ? qn : ''}</span>`).join('') : '';
  const quick = document.getElementById('quick');
  if (quick) {
    quick.innerHTML = typing ? '' : (session.quickReplies || []).map((q) => `<button>${esc(q)}</button>`).join('');
    quick.querySelectorAll('button').forEach((b) => b.onclick = () => { document.getElementById('input').value = b.textContent; answer(); });
  }
  if (session.status !== 'active' && document.getElementById('composer')) {
    document.getElementById('composer').outerHTML = `<div class="done">${MASCOT('joy')}<p>${t('thanks')}</p></div><div class="card rating" id="rating"></div>`;
    renderRating();
  }
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

async function answer(finish = false) {
  if (busy) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text && !finish) return;
  busy = true;
  document.getElementById('send').disabled = true;
  if (text) session.messages.push({ role: 'user', text });
  input.value = ''; input.style.height = 'auto';
  drawMessages(true);
  try {
    session = await api(`/api/public/sessions/${session.id}/${finish ? 'finish' : 'answer'}`, { method: 'POST', body: JSON.stringify({ text }) });
  } catch (e) {
    if (text) { session.messages.pop(); input.value = text; }
    alert(t('err') + '\n' + e.message);
  }
  busy = false;
  const s = document.getElementById('send'); if (s) s.disabled = false;
  drawMessages();
  document.getElementById('input')?.focus();
}

function renderRating() {
  const el = document.getElementById('rating');
  if (!el) return;
  if (session.rated) { el.innerHTML = `<p class="small">${t('rateThanks')}</p>`; localStorage.removeItem(store); return; }
  let score = 0;
  el.innerHTML = `<div><b>${t('rateQ')}</b></div><div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button data-n="${n}" aria-label="${n}">${SAKURA}</button>`).join('')}</div>
    <textarea id="rc" rows="2" placeholder="${t('rateC')}"></textarea><button class="go" id="rs" disabled>${t('rateSend')}</button>`;
  el.querySelectorAll('.stars button').forEach((b) => b.onclick = () => { score = +b.dataset.n; el.querySelectorAll('.stars button').forEach((x) => x.classList.toggle('on', +x.dataset.n <= score)); el.querySelector('#rs').disabled = false; });
  el.querySelector('#rs').onclick = async () => {
    try { session = await api(`/api/public/sessions/${session.id}/rating`, { method: 'POST', body: JSON.stringify({ score, comment: el.querySelector('#rc').value }) }); } catch { session.rated = true; }
    renderRating();
  };
}

init();
</script>
</body>
